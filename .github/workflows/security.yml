name: Security
on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks needs full history for push scans

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # required since gitleaks-action v2

      # Dependency-vuln scan. A pure-Bash repo has no lockfiles, so this stays
      # green until Phase 5+ adds containers/manifests to scan.
      - name: trivy filesystem
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"

      # semgrep static analysis. Report-only for now (annotates findings without
      # blocking); becomes a hard gate in Day 17 (Security fundamentals).
      - name: semgrep
        continue-on-error: true
        run: |
          python3 -m pip install --quiet semgrep
          semgrep scan --config p/bash --config p/secrets --error
