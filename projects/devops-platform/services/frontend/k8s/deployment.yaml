apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: devops-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # Stock nginx works out of the box; to serve the custom page build &
          # load the image instead:
          #   docker build -t devops-platform/frontend:1.0.0 services/frontend
          #   kind load docker-image devops-platform/frontend:1.0.0 --name bash-mastery
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 24Mi
            limits:
              cpu: 100m
              memory: 64Mi
