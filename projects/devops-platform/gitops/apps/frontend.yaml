# Leaf Application — ArgoCD syncs the frontend k8s manifests into the cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ericvalijani/bash-mastery-devops.git
    targetRevision: HEAD
    path: projects/devops-platform/services/frontend/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: frontend
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
